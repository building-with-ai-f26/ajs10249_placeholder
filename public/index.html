<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRECRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---- Brand settings: change colors, fonts and logo here ---- */
    :root {
      --brand: #57068c;         /* NYU violet, matches the SREC logo */
      --brand-dark: #3d0463;
      --brand-soft: #f3ecf9;
      --ink: #1b1726;
      --muted: #5f5a6b;
      --line: #e7e3ee;
      --page: #f6f4f9;
      --card: #ffffff;
      --radius: 12px;
      --font: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --logo: url("img/Logo-White.png");
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); line-height: 1.5; }

    .topbar { background: var(--card); border-bottom: 4px solid var(--brand); }
    .topbar-inner { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
    /* The logo file is a square with padding; this shows just the artwork. */
    .logo {
      --h: 46px; flex: none; height: var(--h); width: calc(var(--h) * 689 / 505);
      background: var(--logo) no-repeat;
      background-size: calc(var(--h) * 2000 / 505);
      background-position: calc(var(--h) * -660 / 505) calc(var(--h) * -751 / 505);
    }
    .app-title { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    .app-title small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
    #source:empty { display: none; }
    #source { margin-left: auto; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
    #source::before { content: "●"; margin-right: 6px; color: #16a34a; }

    main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    #search {
      width: 100%; padding: 14px 16px 14px 44px; font: inherit; font-size: 16px; color: var(--ink);
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(27, 23, 38, 0.04);
    }
    #search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    #stats { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 16px; margin-top: 14px; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(27, 23, 38, 0.05); }

    #results { list-style: none; margin: 0; padding: 6px; max-height: 72vh; overflow-y: auto; }
    #results button {
      all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 10px; border-radius: 8px; cursor: pointer;
    }
    #results button:hover, #results button:focus-visible { background: var(--page); }
    #results button.selected { background: var(--brand-soft); }
    .avatar {
      flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
      font-size: 13px; font-weight: 700; background: var(--brand-soft); color: var(--brand);
    }
    .avatar.org { border-radius: 8px; background: var(--brand); color: #ffffff; }
    .item-text { min-width: 0; flex: 1; }
    .item-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: #eeecf2; color: #4a4558; }
    .badge.good { background: #dcfce7; color: #166534; }
    .badge.info { background: #dbeafe; color: #1e40af; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .badge.bad { background: #fee2e2; color: #991b1b; }
    .badge.brand { background: var(--brand-soft); color: var(--brand); }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

    #detail { padding: 20px; min-height: 240px; }
    .kind { font-size: 11px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: 0.08em; }
    .sub { font-size: 14px; color: var(--muted); }
    #detail h2 { font-size: 22px; margin: 2px 0 2px; letter-spacing: -0.01em; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 18px 0 0; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    .empty { color: var(--muted); }
    #detail h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 24px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); }
    .link { all: unset; cursor: pointer; color: var(--brand); font-weight: 600; }
    .link:hover, .link:focus-visible { text-decoration: underline; }
    .history { list-style: none; margin: 0; padding: 0; }
    .history li { padding: 10px 0 10px 14px; border-left: 2px solid var(--brand-soft); position: relative; }
    .history li::before { content: ""; position: absolute; left: -5px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }

    .log-form { display: grid; gap: 10px; }
    .log-form label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
    .log-form input, .log-form select, .log-form textarea {
      font: inherit; font-size: 14px; color: var(--ink); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; background: #ffffff;
    }
    .log-form input:focus, .log-form select:focus, .log-form textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .log-form .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 640px) { .log-form .row { grid-template-columns: 1fr; } }
    .log-form .row-end { display: flex; align-items: center; gap: 12px; }
    .btn {
      font: inherit; font-weight: 600; padding: 9px 16px; border: 0; border-radius: 8px; background: var(--brand); color: #ffffff; cursor: pointer;
    }
    .btn:hover { background: var(--brand-dark); }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo" role="img" aria-label="Stern Real Estate Club"></div>
      <h1 class="app-title">Sponsorship CRM<small>Stern Real Estate Club</small></h1>
      <span id="source"></span>
    </div>
  </header>
  <main>
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search a firm, contact or title" autocomplete="off" aria-label="Search a firm, contact or title">
    </div>
    <p id="stats"></p>
    <div class="layout">
      <ul id="results" class="card" aria-label="Results"></ul>
      <section id="detail" class="card" aria-live="polite"><p class="empty">Select a contact or firm to see details.</p></section>
    </div>
  </main>

  <script>
    let data = { Organizations: [], Contacts: [], Outreach_Log: [], Channels: [], Owners: [], Source: {} };
    let selectedKey = null;

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function orgByName(name) {
      return data.Organizations.find(o => o.Org_Name === name) || null;
    }

    // Outreach_Log rows for the given contact IDs, newest first.
    function historyFor(contactIds) {
      const rows = data.Outreach_Log.filter(r => contactIds.includes(r.Contact_ID));
      return rows.sort((a, b) => String(b.Date).localeCompare(String(a.Date)));
    }

    function lastTouch(contactIds) {
      return historyFor(contactIds)[0] || null;
    }

    function contactName(id) {
      const c = data.Contacts.find(x => x.Contact_ID === id);
      return c ? c.Name : id;
    }

    function renderHistory(rows, showContact) {
      if (!rows.length) return '<h3>Outreach history</h3><p class="empty">No outreach logged.</p>';
      return `<h3>Outreach history (${rows.length})</h3><ul class="history">` + rows.map(r => `
        <li>
          <div class="sub">${esc(r.Date)} · ${esc(r.Channel)} · ${esc(r.Owner)}${showContact ? " · " + esc(contactName(r.Contact_ID)) : ""}</div>
          <div>${esc(r.Summary)}</div>
        </li>`).join("") + "</ul>";
    }

    function touchText(row) {
      if (!row) return "No outreach logged";
      return `${row.Date} · ${row.Channel} · ${row.Owner}: ${row.Summary}`;
    }

    function orDash(v) { return v ? v : "—"; }

    const BADGE_TONES = {
      "active sponsor": "good", "yes": "good", "prospect": "info", "in negotiation": "warn",
      "declined": "bad", "no": "bad", "approved": "good", "pending": "warn", "do not contact": "bad",
    };
    function badge(text, prefix) {
      if (!text) return "";
      const tone = BADGE_TONES[String(text).toLowerCase()] || "";
      return `<span class="badge ${tone}">${esc(prefix ? prefix + text : text)}</span>`;
    }

    function initials(name) {
      return String(name).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
    }

    function isApproved(c) { return /^(yes|approved)$/i.test(c.Approval || ""); }
    function approvalBadge(c) {
      if (!c.Approval) return "";
      if (isApproved(c)) return badge("Approved");
      if (/^no$/i.test(c.Approval)) return badge("Not approved").replace("badge ", "badge bad ");
      return badge(c.Approval);
    }

    function joinSub(...parts) { return parts.filter(Boolean).join(" · "); }

    function buildItems(query) {
      const q = query.trim().toLowerCase();
      const items = [];
      for (const c of data.Contacts) {
        const hay = `${c.Name} ${c.Title} ${c.Organization}`.toLowerCase();
        if (!q || hay.includes(q)) {
          items.push({ key: "c:" + c.Contact_ID, kind: "Contact", title: c.Name, sub: joinSub(c.Title, c.Organization),
            badge: isApproved(c) ? badge("Approved") : "" });
        }
      }
      for (const o of data.Organizations) {
        if (!q || o.Org_Name.toLowerCase().includes(q)) {
          items.push({ key: "o:" + o.Org_Name, kind: "Organization", title: o.Org_Name,
            sub: joinSub("Firm", o.Current_Tier), badge: badge(o.Sponsor_Status) });
        }
      }
      return items;
    }

    function renderResults() {
      const items = buildItems(document.getElementById("search").value);
      const list = document.getElementById("results");
      if (!items.length) {
        list.innerHTML = '<li><p class="empty" style="padding:10px 12px;margin:0">No matches.</p></li>';
        return;
      }
      list.innerHTML = items.map(it => `
        <li><button type="button" data-key="${esc(it.key)}" class="${it.key === selectedKey ? "selected" : ""}">
          <span class="avatar ${it.kind === "Organization" ? "org" : ""}" aria-hidden="true">${esc(initials(it.title))}</span>
          <span class="item-text">
            <span class="item-title" style="display:block">${esc(it.title)}</span>
            <span class="item-sub" style="display:block">${esc(it.sub)}</span>
          </span>
          ${it.badge}
        </button></li>`).join("");
    }

    const SOURCE_LABELS = { sample: "Sample data", xlsx: "Excel copy (read-only)", google: "Live Google Sheet" };

    // Form to log an outreach. One contact: fixed. Several (firm view): pick one.
    function renderLogForm(contacts, defaultOwner) {
      if (!contacts.length) return "";
      if (!data.Source.canWrite) return '<h3>Log outreach</h3><p class="empty">Logging is off while reading the Excel copy.</p>';
      const today = new Date().toLocaleDateString("en-CA");
      const who = contacts.length === 1
        ? `<input type="hidden" name="Contact_ID" value="${esc(contacts[0].Contact_ID)}">`
        : `<label>Contact<select name="Contact_ID" required>${contacts.map(c =>
            `<option value="${esc(c.Contact_ID)}">${esc(c.Name)}</option>`).join("")}</select></label>`;
      return `
        <h3>Log outreach</h3>
        <form id="log-form" class="log-form">
          ${who}
          <div class="row">
            <label>Date<input type="date" name="Date" value="${esc(today)}" required></label>
            <label>Channel<select name="Channel" required>${data.Channels.map(ch =>
              `<option>${esc(ch)}</option>`).join("")}</select></label>
            <label>Owner<input type="text" name="Owner" value="${esc(defaultOwner)}" maxlength="80" list="owners" required></label>
            <datalist id="owners">${data.Owners.map(o => `<option value="${esc(o)}">`).join("")}</datalist>
          </div>
          <label>Summary<textarea name="Summary" rows="2" maxlength="500" required></textarea></label>
          <div class="row-end">
            <button type="submit" class="btn">Log outreach</button>
            <span id="log-status" class="sub" role="status"></span>
          </div>
        </form>`;
    }

    function renderContact(c) {
      const org = orgByName(c.Organization);
      return `
        <div class="kind">Contact</div>
        <h2>${esc(c.Name)}</h2>
        <div class="sub">${esc(c.Title)}${org ? ` at <button type="button" class="link" data-key="o:${esc(org.Org_Name)}">${esc(org.Org_Name)}</button>` : c.Organization ? ", " + esc(c.Organization) : ""}</div>
        <div class="badges">
          ${approvalBadge(c)}
          ${badge(c.Status)}
          ${org ? badge(org.Sponsor_Status) : ""}
        </div>
        <dl>
          <dt>Owner</dt><dd>${esc(orDash(c.Owner))}</dd>
          <dt>Last touch</dt><dd>${esc(touchText(lastTouch([c.Contact_ID])))}</dd>
          <dt>Firm tier</dt><dd>${esc(orDash(org && org.Current_Tier))}</dd>
        </dl>
        ${renderLogForm([c], c.Owner)}
        ${renderHistory(historyFor([c.Contact_ID]), false)}`;
    }

    function renderOrg(o) {
      const contacts = data.Contacts.filter(c => c.Organization === o.Org_Name);
      const owners = [...new Set(contacts.map(c => c.Owner).filter(Boolean))];
      const names = contacts.map(c =>
        `<button type="button" class="link" data-key="c:${esc(c.Contact_ID)}">${esc(c.Name)}</button>${isApproved(c) ? " ✓" : ""}`);
      return `
        <div class="kind">Organization</div>
        <h2>${esc(o.Org_Name)}</h2>
        <div class="badges">
          ${badge(o.Sponsor_Status)}
          ${o.Current_Tier ? `<span class="badge brand">${esc(o.Current_Tier)}</span>` : ""}
          ${o.Outreach_Stage ? `<span class="badge">${esc(o.Outreach_Stage)}</span>` : ""}
        </div>
        <dl>
          <dt>Owner</dt><dd>${esc(owners.length ? owners.join(", ") : "—")}</dd>
          <dt>Last touch</dt><dd>${esc(touchText(lastTouch(contacts.map(c => c.Contact_ID))))}</dd>
          <dt>Contacts (${contacts.length})</dt><dd>${names.length ? names.join(", ") : "—"}</dd>
        </dl>
        ${renderLogForm(contacts, owners[0] || "")}
        ${renderHistory(historyFor(contacts.map(c => c.Contact_ID)), true)}`;
    }

    function renderDetail() {
      const panel = document.getElementById("detail");
      if (!selectedKey) {
        panel.innerHTML = '<p class="empty">Select a contact or firm to see details.</p>';
        return;
      }
      const id = selectedKey.slice(2);
      if (selectedKey.startsWith("c:")) {
        const c = data.Contacts.find(x => x.Contact_ID === id);
        panel.innerHTML = c ? renderContact(c) : "";
      } else {
        const o = orgByName(id);
        panel.innerHTML = o ? renderOrg(o) : "";
      }
    }

    document.getElementById("search").addEventListener("input", renderResults);
    document.getElementById("results").addEventListener("click", e => {
      const btn = e.target.closest("button[data-key]");
      if (!btn) return;
      select(btn.dataset.key);
    });

    function select(key) {
      selectedKey = key;
      history.replaceState(null, "", "#" + encodeURIComponent(key));
      renderResults();
      renderDetail();
    }

    // Firm and contact names inside the detail panel jump to that record.
    document.getElementById("detail").addEventListener("click", e => {
      const link = e.target.closest("button.link[data-key]");
      if (!link) return;
      select(link.dataset.key);
    });

    document.getElementById("detail").addEventListener("submit", async e => {
      if (e.target.id !== "log-form") return;
      e.preventDefault();
      const form = e.target;
      const button = form.querySelector("button");
      const status = document.getElementById("log-status");
      const row = Object.fromEntries(new FormData(form));
      button.disabled = true;
      status.className = "sub";
      status.textContent = "Saving…";
      try {
        const res = await fetch("/api/outreach", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(row),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || "Could not save");
        data.Outreach_Log.push(json);
        renderDetail();
        const fresh = document.getElementById("log-status");
        if (fresh) fresh.textContent = "Logged.";
      } catch (err) {
        status.className = "sub error";
        status.textContent = err.message;
        button.disabled = false;
      }
    });

    fetch("/api/data")
      .then(async r => {
        const json = await r.json().catch(() => ({}));
        if (!r.ok) throw json;
        return json;
      })
      .then(json => {
        data = json;
        document.getElementById("source").textContent = SOURCE_LABELS[data.Source.mode] || "";
        const approved = data.Contacts.filter(isApproved).length;
        const active = data.Organizations.filter(o => o.Sponsor_Status === "Active Sponsor").length;
        document.getElementById("stats").textContent =
          `${data.Organizations.length} firms · ${data.Contacts.length} contacts · ${approved} approved to contact · ${active} active sponsors`;
        const fromLink = decodeURIComponent(location.hash.slice(1));
        if (fromLink) select(fromLink); else renderResults();
      })
      .catch(err => {
        const msg = (err && err.error) || "Could not load data.";
        const link = err && err.signIn ? ` <a href="${esc(err.signIn)}">Sign in with Google</a>` : "";
        document.getElementById("results").innerHTML =
          `<li><p class="empty" style="padding:10px 12px;margin:0">${esc(msg)}${link}</p></li>`;
      });
  </script>
</body>
</html>
