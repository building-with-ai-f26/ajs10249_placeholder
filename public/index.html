<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRECRM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    #search {
      width: 100%; padding: 10px 12px; font-size: 16px;
      border: 1px solid #c4c4c4; border-radius: 6px;
    }
    .layout { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; margin-top: 16px; }
    @media (max-width: 640px) { .layout { grid-template-columns: 1fr; } }
    #results { list-style: none; margin: 0; padding: 0; border: 1px solid #e0e0e0; border-radius: 6px; max-height: 70vh; overflow-y: auto; }
    #results li { border-bottom: 1px solid #eeeeee; }
    #results li:last-child { border-bottom: 0; }
    #results button {
      all: unset; box-sizing: border-box; display: block; width: 100%; padding: 10px 12px; cursor: pointer;
    }
    #results button:hover, #results button:focus-visible { background: #f2f5fb; }
    #results button.selected { background: #e3eafa; }
    .kind { font-size: 12px; color: #555555; text-transform: uppercase; letter-spacing: 0.04em; }
    .sub { font-size: 14px; color: #555555; }
    #detail { border: 1px solid #e0e0e0; border-radius: 6px; padding: 16px; min-height: 200px; }
    #detail h2 { font-size: 20px; margin: 0 0 4px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; }
    dt { color: #555555; }
    dd { margin: 0; }
    .empty { color: #555555; }
    #detail h3 { font-size: 15px; margin: 20px 0 8px; padding-top: 12px; border-top: 1px solid #eeeeee; }
    .history { list-style: none; margin: 0; padding: 0; }
    .history li { padding: 6px 0; border-bottom: 1px solid #f2f2f2; }
    .history li:last-child { border-bottom: 0; }
    .log-form { display: grid; gap: 8px; }
    .log-form label { display: grid; gap: 2px; font-size: 14px; color: #555555; }
    .log-form input, .log-form select, .log-form textarea {
      font: inherit; color: #1a1a1a; padding: 6px 8px; border: 1px solid #c4c4c4; border-radius: 6px; min-width: 0;
    }
    .log-form .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (max-width: 640px) { .log-form .row { grid-template-columns: 1fr; } }
    .log-form .row-end { display: flex; align-items: center; gap: 12px; }
    .log-form button {
      font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: #1d4ed8; color: #ffffff; cursor: pointer;
    }
    .log-form button:disabled { opacity: 0.6; cursor: default; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>SRECRM</h1>
    <input id="search" type="search" placeholder="Search a firm or contact" autocomplete="off" aria-label="Search a firm or contact">
    <div class="layout">
      <ul id="results" aria-label="Results"></ul>
      <section id="detail" aria-live="polite"><p class="empty">Select a contact or firm to see details.</p></section>
    </div>
  </main>

  <script>
    let data = { Organizations: [], Contacts: [], Outreach_Log: [] };
    let selectedKey = null;

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function orgByName(name) {
      return data.Organizations.find(o => o.Org_Name === name) || null;
    }

    // Outreach_Log rows for the given contact IDs, newest first.
    function historyFor(contactIds) {
      const rows = data.Outreach_Log.filter(r => contactIds.includes(r.Contact_ID));
      return rows.sort((a, b) => String(b.Date).localeCompare(String(a.Date)));
    }

    function lastTouch(contactIds) {
      return historyFor(contactIds)[0] || null;
    }

    function contactName(id) {
      const c = data.Contacts.find(x => x.Contact_ID === id);
      return c ? c.Name : id;
    }

    function renderHistory(rows, showContact) {
      if (!rows.length) return '<h3>Outreach history</h3><p class="empty">No outreach logged.</p>';
      return `<h3>Outreach history (${rows.length})</h3><ul class="history">` + rows.map(r => `
        <li>
          <div class="sub">${esc(r.Date)} · ${esc(r.Channel)} · ${esc(r.Owner)}${showContact ? " · " + esc(contactName(r.Contact_ID)) : ""}</div>
          <div>${esc(r.Summary)}</div>
        </li>`).join("") + "</ul>";
    }

    function touchText(row) {
      if (!row) return "No outreach logged";
      return `${row.Date} · ${row.Channel} · ${row.Owner}: ${row.Summary}`;
    }

    function orDash(v) { return v ? v : "—"; }

    function buildItems(query) {
      const q = query.trim().toLowerCase();
      const items = [];
      for (const c of data.Contacts) {
        const hay = `${c.Name} ${c.Title} ${c.Organization}`.toLowerCase();
        if (!q || hay.includes(q)) {
          items.push({ key: "c:" + c.Contact_ID, kind: "Contact", title: c.Name, sub: `${c.Title}, ${c.Organization}` });
        }
      }
      for (const o of data.Organizations) {
        if (!q || o.Org_Name.toLowerCase().includes(q)) {
          items.push({ key: "o:" + o.Org_Name, kind: "Organization", title: o.Org_Name, sub: orDash(o.Sponsor_Status) });
        }
      }
      return items;
    }

    function renderResults() {
      const items = buildItems(document.getElementById("search").value);
      const list = document.getElementById("results");
      if (!items.length) {
        list.innerHTML = '<li><p class="empty" style="padding:10px 12px;margin:0">No matches.</p></li>';
        return;
      }
      list.innerHTML = items.map(it => `
        <li><button type="button" data-key="${esc(it.key)}" class="${it.key === selectedKey ? "selected" : ""}">
          <div class="kind">${esc(it.kind)}</div>
          <div>${esc(it.title)}</div>
          <div class="sub">${esc(it.sub)}</div>
        </button></li>`).join("");
    }

    const CHANNELS = ["Email", "Call", "LinkedIn", "In Person", "Other"];

    // Form to log an outreach. One contact: fixed. Several (firm view): pick one.
    function renderLogForm(contacts, defaultOwner) {
      if (!contacts.length) return "";
      const today = new Date().toLocaleDateString("en-CA");
      const who = contacts.length === 1
        ? `<input type="hidden" name="Contact_ID" value="${esc(contacts[0].Contact_ID)}">`
        : `<label>Contact<select name="Contact_ID" required>${contacts.map(c =>
            `<option value="${esc(c.Contact_ID)}">${esc(c.Name)}</option>`).join("")}</select></label>`;
      return `
        <h3>Log outreach</h3>
        <form id="log-form" class="log-form">
          ${who}
          <div class="row">
            <label>Date<input type="date" name="Date" value="${esc(today)}" required></label>
            <label>Channel<select name="Channel" required>${CHANNELS.map(ch =>
              `<option>${esc(ch)}</option>`).join("")}</select></label>
            <label>Owner<input type="text" name="Owner" value="${esc(defaultOwner)}" maxlength="80" required></label>
          </div>
          <label>Summary<textarea name="Summary" rows="2" maxlength="500" required></textarea></label>
          <div class="row-end">
            <button type="submit">Log outreach</button>
            <span id="log-status" class="sub" role="status"></span>
          </div>
        </form>`;
    }

    function renderContact(c) {
      const org = orgByName(c.Organization);
      return `
        <div class="kind">Contact</div>
        <h2>${esc(c.Name)}</h2>
        <div class="sub">${esc(c.Title)}, ${esc(c.Organization)}</div>
        <dl>
          <dt>Owner</dt><dd>${esc(orDash(c.Owner))}</dd>
          <dt>Approval</dt><dd>${esc(orDash(c.Approval))}</dd>
          <dt>Status</dt><dd>${esc(orDash(c.Status))}</dd>
          <dt>Last touch</dt><dd>${esc(touchText(lastTouch([c.Contact_ID])))}</dd>
          <dt>Firm sponsor status</dt><dd>${esc(orDash(org && org.Sponsor_Status))}</dd>
          <dt>Firm tier</dt><dd>${esc(orDash(org && org.Current_Tier))}</dd>
        </dl>
        ${renderLogForm([c], c.Owner)}
        ${renderHistory(historyFor([c.Contact_ID]), false)}`;
    }

    function renderOrg(o) {
      const contacts = data.Contacts.filter(c => c.Organization === o.Org_Name);
      const owners = [...new Set(contacts.map(c => c.Owner).filter(Boolean))];
      const names = contacts.map(c => `${c.Name} (${orDash(c.Approval)})`);
      return `
        <div class="kind">Organization</div>
        <h2>${esc(o.Org_Name)}</h2>
        <dl>
          <dt>Owner</dt><dd>${esc(owners.length ? owners.join(", ") : "—")}</dd>
          <dt>Sponsor status</dt><dd>${esc(orDash(o.Sponsor_Status))}</dd>
          <dt>Tier</dt><dd>${esc(orDash(o.Current_Tier))}</dd>
          <dt>Outreach stage</dt><dd>${esc(orDash(o.Outreach_Stage))}</dd>
          <dt>Last touch</dt><dd>${esc(touchText(lastTouch(contacts.map(c => c.Contact_ID))))}</dd>
          <dt>Contacts</dt><dd>${esc(names.length ? names.join("; ") : "—")}</dd>
        </dl>
        ${renderLogForm(contacts, owners[0] || "")}
        ${renderHistory(historyFor(contacts.map(c => c.Contact_ID)), true)}`;
    }

    function renderDetail() {
      const panel = document.getElementById("detail");
      if (!selectedKey) {
        panel.innerHTML = '<p class="empty">Select a contact or firm to see details.</p>';
        return;
      }
      const id = selectedKey.slice(2);
      if (selectedKey.startsWith("c:")) {
        const c = data.Contacts.find(x => x.Contact_ID === id);
        panel.innerHTML = c ? renderContact(c) : "";
      } else {
        const o = orgByName(id);
        panel.innerHTML = o ? renderOrg(o) : "";
      }
    }

    document.getElementById("search").addEventListener("input", renderResults);
    document.getElementById("results").addEventListener("click", e => {
      const btn = e.target.closest("button[data-key]");
      if (!btn) return;
      selectedKey = btn.dataset.key;
      renderResults();
      renderDetail();
    });

    document.getElementById("detail").addEventListener("submit", async e => {
      if (e.target.id !== "log-form") return;
      e.preventDefault();
      const form = e.target;
      const button = form.querySelector("button");
      const status = document.getElementById("log-status");
      const row = Object.fromEntries(new FormData(form));
      button.disabled = true;
      status.className = "sub";
      status.textContent = "Saving…";
      try {
        const res = await fetch("/api/outreach", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(row),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || "Could not save");
        data.Outreach_Log.push(json);
        renderDetail();
        const fresh = document.getElementById("log-status");
        if (fresh) fresh.textContent = "Logged.";
      } catch (err) {
        status.className = "sub error";
        status.textContent = err.message;
        button.disabled = false;
      }
    });

    fetch("/api/data")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(json => { data = json; renderResults(); })
      .catch(() => {
        document.getElementById("results").innerHTML = '<li><p class="empty" style="padding:10px 12px;margin:0">Could not load data.</p></li>';
      });
  </script>
</body>
</html>
